# Build SquashFS INTO the kernel (=y, not a loadable module) so a squashfs
# rootfs can be mounted directly at boot with NO initramfs. Required by the
# hardened variant (schultz-image-hardened ships the rootfs as squashfs).
#
# Why this is a bbappend on the kernel and not just an image tweak: the A/B
# layout here boots a SINGLE SHARED kernel from the FAT /boot partition, and a
# RAUC A/B update only rewrites the rootfs *slots* -- it does NOT touch the
# shared kernel. So a squashfs rootfs needs this baked into the flashed /boot
# kernel: the hardened image requires a FRESH FLASH of an SD image built with
# this fragment, not merely a rootfs OTA. (Proven the hard way: OTA'ing the
# squashfs onto the old ext4-only kernel panics with "Unable to mount root fs".)
# See docs/rauc-ab-updates.md, "Hardened variant".
CONFIG_SQUASHFS=y
# Decompressors -- include the common ones so whatever mksquashfs used will
# mount (mksquashfs defaults to gzip -> ZLIB; the others are cheap insurance).
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_LZ4=y
CONFIG_SQUASHFS_LZO=y
CONFIG_SQUASHFS_ZSTD=y
