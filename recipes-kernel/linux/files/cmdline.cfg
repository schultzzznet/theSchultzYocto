# Auto-rollback safety net for A/B: on a kernel panic, reboot after 10s instead
# of hanging forever. Combined with U-Boot's per-slot boot-attempt counter, a
# broken update then rolls back to the good slot on its OWN -- each panic reboots,
# U-Boot decrements BOOT_x_LEFT, and after the attempts run out it falls back to
# the other slot. No power-cycling, no serial. (Learned the hard way: the first
# hardened boot panicked and just hung, needing a manual power-cycle.)
#
# CONFIG_CMDLINE_EXTEND appends CONFIG_CMDLINE to whatever bootargs U-Boot passes
# (root=/dev/mmcblk0pN rauc.slot=X ...), rather than replacing them -- so the
# rauc slot selection is preserved and "panic=10" is just tacked on.
CONFIG_CMDLINE="panic=10"
CONFIG_CMDLINE_EXTEND=y
