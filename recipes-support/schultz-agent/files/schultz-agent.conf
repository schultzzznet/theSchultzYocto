# theSchultzYocto fleet agent configuration.
# Every value can also be overridden by an environment variable of the same name.

# Fleet dashboard endpoint (the fleet-app ingress in the cluster). The agent
# POSTs to <FLEET_URL>/api/agent/heartbeat. Behind Traefik this is the node +
# the /fleet path prefix. Use an IP if the device can't resolve .local.
FLEET_URL=http://delli7c6g32.local/fleet

# Shared token; must match the fleet-agent-token Secret (fleet.agent-token).
FLEET_TOKEN=change-me-fleet-agent-token

# Heartbeat interval, seconds.
INTERVAL=30

# Friendly display name (defaults to the hostname if empty).
DEVICE_NAME=

# Board type, for display only.
MACHINE=raspberrypi3-64

# Which mount to report disk usage for. The persistent data partition is more
# meaningful than a read-only squashfs root; falls back to / if absent.
DISK_PATH=/data
