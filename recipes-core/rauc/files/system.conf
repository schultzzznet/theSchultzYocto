## theSchultzYocto RAUC system configuration -- A/B, U-Boot.
##
## Real A/B as of 2026-07-05. Paired with meta-rauc-raspberrypi's dual-slot wic
## layout and U-Boot boot script, built via scripts/setup-rauc-build.sh into a
## separate build-rauc/ dir. Slot devices below match that layout:
##   mmcblk0p1  /boot  (FAT: RPi firmware + u-boot.bin + dtbs)
##   mmcblk0p2  rootfs_A  (slot A)
##   mmcblk0p3  rootfs_B  (slot B)
##   mmcblk0p4  /data     (rauc data-directory + shared state)
##   mmcblk0p5  /home
## U-Boot reads BOOT_ORDER / BOOT_x_LEFT from its env and boots A or B, falling
## back on failed boots; `rauc` flips those via u-boot-fw-utils. See
## docs/rauc-ab-updates.md.

[system]
# Rewritten at do_install from ${MACHINE} by rauc-conf.bbappend; the value here
# is the default board. Must equal the bundle's RAUC_BUNDLE_COMPATIBLE.
compatible=theSchultzYocto-raspberrypi3-64
bootloader=uboot
data-directory=/data/
bundle-formats=-plain

[keyring]
# Our own dev cert (public half of scripts/generate-signing-keys.sh's
# development-1 key), installed alongside this file by rauc-conf.bbappend's
# RAUC_KEYRING_FILE. rauc only accepts bundles signed by this key -- so the
# bundle's RAUC_BUNDLE_COMPATIBLE must also equal the compatible above.
#
# RELATIVE on purpose: rauc resolves a relative keyring against the directory
# holding system.conf. Newer meta-rauc installs both to /usr/lib/rauc/ rather
# than /etc/rauc/, so the old absolute /etc/rauc/... path pointed at a directory
# that no longer exists on wrynose. `rauc status` never reads the keyring, so it
# still looked healthy -- only `rauc install` failed, with "failed to load CA
# file". Relative works under either layout.
path=development-1.cert.pem

# type=raw (not ext4): RAUC writes the slot image block-for-block and does not
# assume a filesystem, so the SAME slots accept BOTH the standard ext4 image and
# the hardened squashfs image (RAUC rejects a squashfs image into an ext4-typed
# slot: "Unsupported image type 'squashfs' for slot type 'ext4'"). The kernel
# still auto-detects the actual fs at boot from root=/dev/mmcblk0pN. We use a
# central data-directory for slot status (above), so RAUC never needs to mount a
# slot -- nothing is lost by going raw. (rootfs is RO content; no resize needed.)
[slot.rootfs.0]
device=/dev/mmcblk0p2
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=raw
bootname=B
