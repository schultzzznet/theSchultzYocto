## theSchultzYocto RAUC system configuration -- A/B, U-Boot, raspberrypi3-64.
##
## Real A/B as of 2026-07-05. Paired with meta-rauc-raspberrypi's dual-slot wic
## layout and U-Boot boot script, built via scripts/setup-rauc-build.sh into a
## separate build-rauc/ dir. Slot devices below match that layout:
##   mmcblk0p1  /boot  (FAT: RPi firmware + u-boot.bin + dtbs)
##   mmcblk0p2  rootfs_A  (slot A)
##   mmcblk0p3  rootfs_B  (slot B)
##   mmcblk0p4  /data     (rauc data-directory + shared state)
##   mmcblk0p5  /home
## U-Boot reads BOOT_ORDER / BOOT_x_LEFT from its env and boots A or B, falling
## back on failed boots; `rauc` flips those via u-boot-fw-utils. See
## docs/rauc-ab-updates.md.

[system]
compatible=theSchultzYocto-raspberrypi3-64
bootloader=uboot
data-directory=/data/
bundle-formats=-plain

[keyring]
# Our own dev cert (public half of scripts/generate-signing-keys.sh's
# development-1 key), installed to /etc/rauc/ by rauc-conf.bbappend's
# RAUC_KEYRING_FILE. rauc only accepts bundles signed by this key -- so the
# bundle's RAUC_BUNDLE_COMPATIBLE must also equal the compatible above.
path=development-1.cert.pem

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
