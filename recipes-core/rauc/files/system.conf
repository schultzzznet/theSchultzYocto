## theSchultzYocto RAUC system configuration.
##
## This lets `bitbake schultz-bundle` build and sign a real RAUC bundle
## (verified 2026-07-03) and installs onto the target so a running system
## has a keyring to verify future bundles against.
##
## What this does NOT do: make `rauc install` actually work end-to-end on
## real hardware. There's no [slot.*] section below on purpose -- the
## current wic layout is a single rootfs partition with no A/B scheme, and
## there's no U-Boot integration yet. Adding fake slot device paths here
## would be actively misleading (they'd point at partitions that don't
## exist). See docs/yocto-concepts.md for exactly what's scaffolded vs.
## what still needs a real partition layout + physical hardware bring-up.

[system]
compatible=theSchultzYocto-raspberrypi3-64
bootloader=uboot
bundle-formats=-plain

# Real A/B slots need a wic layout with (at least) two rootfs partitions
# and a bootloader that can switch between them -- not implemented yet.
# Reference shape (from meta-rauc-community's meta-rauc-raspberrypi
# example), for when that work actually happens:
#
# [slot.rootfs.0]
# device=/dev/mmcblk0p2
# type=ext4
# bootname=system0
#
# [slot.rootfs.1]
# device=/dev/mmcblk0p3
# type=ext4
# bootname=system1
